[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaam-ui"
version = "0.1.0"
description = "Desktop audio/video transcription with GigaAM-v3 (PySide6, Win/macOS)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    # Not used at runtime (Silero VAD), but transformers scans the remote
    # modeling file's imports and refuses to load GigaAM without it.
    "pyannote-audio",
    "silero-vad",
    "soundfile",
    "huggingface_hub",
    "hydra-core",
    "omegaconf",
    "sentencepiece",
    "PySide6",
]

[project.scripts]
gigaam-ui = "gigaam_ui.__main__:main"
gigaam-ui-gui = "gigaam_ui.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
