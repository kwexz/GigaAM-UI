name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  FFMPEG_WIN_URL: "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
  FFMPEG_MAC_URL: "https://evermeet.cx/ffmpeg/ffmpeg-7.1.1.zip"

jobs:
  engine:
    strategy:
      matrix:
        include:
          - os: windows-latest
            pack: engine-cpu-win-x64
          - os: macos-14
            pack: engine-cpu-mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        # CPU engine pack. A CUDA pack later adds --index-url https://download.pytorch.org/whl/cuXY
        # and torchcodec/CUDA-compatible pins; the manifest gains engine-cuda-win-x64.
        run: >
          pip install pyinstaller torch torchaudio transformers==4.57.1
          pyannote-audio silero-vad soundfile huggingface_hub hydra-core
          omegaconf sentencepiece
      - name: Build worker bundle
        run: >
          pyinstaller --onedir --noconfirm --console --name GigaAM-Worker
          --paths src --distpath dist --workpath build
          --collect-all torch --collect-all torchaudio
          --collect-all transformers --collect-all tokenizers
          --collect-all huggingface_hub --collect-all hydra
          --collect-all omegaconf --collect-all sentencepiece
          --collect-all silero_vad --collect-all soundfile
          --collect-all regex --collect-all safetensors
          --exclude-module PySide6 --exclude-module shiboken6
          --exclude-module sklearn --exclude-module pandas
          --exclude-module matplotlib --exclude-module PIL
          --exclude-module grpc --exclude-module google
          --exclude-module scipy --exclude-module tkinter
          --exclude-module pydoc
          src/gigaam_ui/worker/__main__.py
      - name: Prune dead weight (static libs, headers)
        shell: pwsh
        run: |
          # PyInstaller hauls torch's 2+ GB of .lib link-libraries and headers:
          # useless at runtime. NOTE: -Include is silently ignored with
          # -LiteralPath on PS 5.1, hence Where-Object (deletes must filter!).
          $root = "dist/GigaAM-Worker/_internal"
          Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Extension -in ".lib", ".pdb", ".exp" } |
            Remove-Item -Force
          Remove-Item -Path "$root/torch/include" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build UI bundle (the full app, fetched by the stub)
        run: >
          pip install PySide6 &&
          pyinstaller --onedir --noconfirm --windowed --name GigaAM-UI
          --paths src --distpath dist-ui --workpath build-ui
          --exclude-module torch --exclude-module torchaudio
          --exclude-module transformers --exclude-module tokenizers
          --exclude-module huggingface_hub --exclude-module hydra
          --exclude-module omegaconf --exclude-module sentencepiece
          --exclude-module silero_vad --exclude-module soundfile
          src/gigaam_ui/desktop/app.py
      - name: Build setup stub (tiny tkinter downloader, stdlib only)
        run: >
          pyinstaller --onedir --noconfirm --windowed --name GigaAM-UI-Setup
          --paths src --distpath dist-stub --workpath build-stub
          src/gigaam_ui/stub/app.py
      - name: Sign Windows binaries (skips without cert)
        if: runner.os == 'Windows'
        env:
          WIN_CERT_B64: ${{ secrets.WIN_CERT_B64 }}
          WIN_CERT_PASS: ${{ secrets.WIN_CERT_PASS }}
        shell: pwsh
        run: |
          # signtool ships with the Windows SDK (preinstalled on windows-latest);
          # verify the exact path against Microsoft Learn when certs arrive.
          if ([string]::IsNullOrEmpty($env:WIN_CERT_B64)) {
            Write-Host "no signing cert, skipping"; exit 0 }
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_B64))
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName 'x64\signtool.exe'
          Get-ChildItem dist, dist-ui, dist-stub -Recurse -Include *.exe | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WIN_CERT_PASS `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
      - name: Sign macOS binaries (skips without identity)
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -z "$MAC_SIGN_IDENTITY" ]; then echo "no identity, skipping"; exit 0; fi
          find dist dist-ui dist-stub -type f -name 'GigaAM-*' -perm +111 | while read -r b; do
            codesign --deep --force --options runtime \
              --sign "$MAC_SIGN_IDENTITY" "$b"
          done
      - name: Pack engine + fetch ffmpeg + manifest fragment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isWin = "${{ runner.os }}" -eq "Windows"
          $exe = "GigaAM-Worker/GigaAM-Worker" + $(if ($isWin) { ".exe" } else { "" })
          $pack = "${{ matrix.pack }}.zip"
          Compress-Archive -Path dist/GigaAM-Worker -DestinationPath $pack
          $gui = "GigaAM-UI-" + $(if ($isWin) { "Windows" } else { "macOS" }) + ".zip"
          Compress-Archive -Path dist-ui/GigaAM-UI -DestinationPath $gui
          $stubId = "stub-" + $(if ($isWin) { "win-x64" } else { "mac-arm64" })
          $stubZip = "GigaAM-UI-Setup-" + $(if ($isWin) { "Windows" } else { "macOS" }) + ".zip"
          Compress-Archive -Path dist-stub/GigaAM-UI-Setup -DestinationPath $stubZip
          if ($isWin) {
            $ffUrl = $env:FFMPEG_WIN_URL; $ffId = "ffmpeg-win-x64"
            $ffFiles = @("bin/ffmpeg.exe", "bin/ffprobe.exe")
            $plat = "win-x64"
            $guiId = "ui-win-x64"
            $guiExe = "GigaAM-UI/GigaAM-UI.exe"
          } else {
            $ffUrl = $env:FFMPEG_MAC_URL; $ffId = "ffmpeg-mac-arm64"
            $ffFiles = @("ffmpeg")
            $plat = "mac-arm64"
            $guiId = "ui-mac-arm64"
            $guiExe = "GigaAM-UI/GigaAM-UI"
          }
          $ffName = "$ffId.zip"
          Invoke-WebRequest -Uri $ffUrl -OutFile $ffName
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $frag = [ordered]@{
            version = 1
            components = @(
              [ordered]@{
                id = "${{ matrix.pack }}"
                title = "Inference engine (${{ matrix.pack }})"
                description = "GigaAM + Silero + PyTorch, no UI"
                version = "${{ github.ref_name }}"
                url = "$base/$pack"
                sha256 = (Get-FileHash $pack -Algorithm SHA256).Hash.ToLower()
                size = (Get-Item $pack).Length
                extract = $true; strip_top = $false; files = @($exe)
                platforms = @($plat); kind = "engine"
              },
              [ordered]@{
                id = $guiId
                title = "GigaAM-UI app ($guiId)"
                description = "Full windowed app, launched by the setup stub"
                version = "${{ github.ref_name }}"
                url = "$base/$gui"
                sha256 = (Get-FileHash $gui -Algorithm SHA256).Hash.ToLower()
                size = (Get-Item $gui).Length
                extract = $true; strip_top = $false; files = @($guiExe)
                platforms = @($plat); kind = "app"
              },
              [ordered]@{
                id = $ffId
                title = "FFmpeg ($ffId)"
                description = "Audio/video decoding, fetched from upstream"
                version = "${{ github.ref_name }}"
                url = $ffUrl
                sha256 = (Get-FileHash $ffName -Algorithm SHA256).Hash.ToLower()
                size = (Get-Item $ffName).Length
                extract = $true; strip_top = $true; files = $ffFiles
                platforms = @($plat); kind = "ffmpeg"
              }
            )
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "manifest-${{ matrix.pack }}.json" -Value $frag -Encoding utf8NoBOM
      # FFmpeg archives are hashed here but NOT uploaded: the manifest
      # points at upstream URLs, so we never redistribute GPL binaries.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}
          path: |
            ${{ matrix.pack }}.zip
            GigaAM-UI-*.zip
            manifest-${{ matrix.pack }}.json

  publish:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Merge manifest
        run: |
          python3 - <<'EOF'
          import json, glob
          comps = []
          for f in sorted(glob.glob("artifacts/manifest-*.json")):
              comps.extend(json.load(open(f))["components"])
          json.dump({"version": 1, "components": comps},
                    open("manifest.json", "w"), indent=2)
          print(f"manifest: {len(comps)} components")
          EOF
      # macOS notarization (needs MAC_APPLE_ID + MAC_APP_PASSWORD + MAC_TEAM_ID):
      # xcrun notarytool submit <engine-mac-zip> --wait, then stapler.
      # Runs here (ubuntu) cannot notarize; move to a macos job when certs arrive.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > NOTES.md <<'EOF'
          ## What to download (one small file)
          | OS | File |
          |---|---|
          | Windows 10/11 (x64) | `GigaAM-UI-Setup-Windows.zip` (~12 MB) |
          | macOS Apple Silicon (M1–M4) | `GigaAM-UI-Setup-macOS.zip` (~15 MB) |
          Do **not** download anything else.
          ## First launch
          1. Unpack the archive, run the setup stub.
          2. Press "Download and install" — the app shows contents and total
             size up front (full app, engine ~150–400 MB, FFmpeg, speech models).
          3. Press "Launch", open or drag & drop audio/video, press Transcribe.
          Full app zips (`GigaAM-UI-Windows.zip` / `-macOS.zip`) are also
          attached for manual setup.
          ## Note
          Unsigned dev builds: Windows SmartScreen and macOS Gatekeeper will
          warn (macOS: right-click → Open). Intel Mac and NVIDIA CUDA are not
          supported yet.
          EOF
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes-file NOTES.md artifacts/*.zip manifest.json
